# Confere a cada push que o código compila e que os dois modos importam sem erro.
name: Verificação

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: pip install -r requirements.txt
      - run: python -m compileall -q main_gui.py web pokebattle
      - run: python -c "import main_gui, web.app"
