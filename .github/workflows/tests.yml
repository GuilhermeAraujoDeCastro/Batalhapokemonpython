name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Rodar a suíte de testes
        run: python -m pytest -v

  gui-smoke:
    name: fumaça do modo gráfico (xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências do sistema (Tkinter + Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Instalar dependências Python
        run: pip install -r requirements.txt
      - name: Rodar o script de fumaça do modo gráfico
        run: xvfb-run -a python3 tests/manual_gui_smoke.py
